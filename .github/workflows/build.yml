name: Generate Beijing Telecom BestCF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Process IPs
        run: |
          mkdir -p ./bestcf/
          OUTPUT_FILE="./bestcf/ctcc-ip.txt"
          > "$OUTPUT_FILE"

          TEMP_ALL=$(mktemp)

          # 从 GitHub 站内可靠源抓取（不会被海外机房 WAF 拦截）
          curl -sSL --connect-timeout 10 --max-time 15 "https://raw.githubusercontent.com/cmliu/WorkerVless2sub/main/addressesapi.txt" >> "$TEMP_ALL" || true
          curl -sSL --connect-timeout 10 --max-time 15 "https://raw.githubusercontent.com/ymyuuu/IPDB/main/bestcf.txt" >> "$TEMP_ALL" || true

          # 提取 IPv4 并打上北京电信标签（取前 5 个）
          V4_LIST=$(grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' "$TEMP_ALL" | sort -u | head -n 5)
          if [ -n "$V4_LIST" ]; then
            INDEX=1
            for ip in $V4_LIST; do
              echo "${ip}#BJ-CT_v4_${INDEX}" >> "$OUTPUT_FILE"
              INDEX=$((INDEX + 1))
            done
          fi

          # 提取 IPv6 并打上北京电信标签（取前 3 个）
          V6_LIST=$(grep -Eo '([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}' "$TEMP_ALL" | sort -u | head -n 3)
          if [ -n "$V6_LIST" ]; then
            INDEX=1
            for ip in $V6_LIST; do
              echo "[${ip}]#BJ-CT_v6_${INDEX}" >> "$OUTPUT_FILE"
              INDEX=$((INDEX + 1))
            done
          fi

          # 如果拉取异常为空，写入基线备用节点
          if [ ! -s "$OUTPUT_FILE" ]; then
            cat << 'EOF' > "$OUTPUT_FILE"
          162.159.35.20#BJ-CT_v4_1
          172.64.147.110#BJ-CT_v4_2
          172.64.155.159#BJ-CT_v4_3
          172.64.150.64#BJ-CT_v4_4
          172.64.144.224#BJ-CT_v4_5
          [2606:4700:53::ed49:aad6]#BJ-CT_v6_1
          [2a06:98c1:3105::c695:78d0]#BJ-CT_v6_2
          [2606:4700:52::e33a:8a05]#BJ-CT_v6_3
          EOF
          fi

          rm -f "$TEMP_ALL"
          echo "==== 成功生成的节点列表 ===="
          cat "$OUTPUT_FILE"

      - name: Deploy to Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: bestcf
          folder: ./bestcf/
          single-commit: true

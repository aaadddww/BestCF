name: Beijing Telecom CF IP
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get BJ Telecom IP
        run: |
          mkdir -p ./bestcf/
          # 直接拉取 CMLiu 在 GitHub 托管的最新实时电信优选库
          curl -fsSL https://githubusercontent.com > ./bestcf/ctcc-ip.txt

      - name: Push to branch
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git checkout -b bestcf
          git add . && git commit -m "Beijing Telecom IP Updated"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}"
          git push -f origin bestcf

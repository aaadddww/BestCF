- name: Fetch and Process IPs
        run: |
          mkdir -p ./bestcf/
          OUTPUT_FILE="./bestcf/ctcc-ip.txt"
          > "$OUTPUT_FILE"
          
          TEMP_ALL=$(mktemp)
          
          # 从 GitHub 站内可靠源直接抓取（不易被拦截）
          curl -sSL --connect-timeout 10 --max-time 15 "https://raw.githubusercontent.com/cmliu/WorkerVless2sub/main/addressesapi.txt" >> "$TEMP_ALL" || true
          curl -sSL --connect-timeout 10 --max-time 15 "https://raw.githubusercontent.com/ymyuuu/IPDB/main/bestcf.txt" >> "$TEMP_ALL" || true

          # 提取 IPv4 并去重打标
          V4_LIST=$(grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' "$TEMP_ALL" | sort -u | head -n 5)
          
          if [ -n "$V4_LIST" ]; then
            INDEX=1
            for ip in $V4_LIST; do
              echo "${ip}#BJ-CT_v4_${INDEX}" >> "$OUTPUT_FILE"
              INDEX=$((INDEX + 1))
            done
          fi

          # 提取 IPv6 并去重打标
          V6_LIST=$(grep -Eo '([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}' "$TEMP_ALL" | sort -u | head -n 3)
          if [ -n "$V6_LIST" ]; then
            INDEX=1
            for ip in $V6_LIST; do
              echo "[${ip}]#BJ-CT_v6_${INDEX}" >> "$OUTPUT_FILE"
              INDEX=$((INDEX + 1))
            done
          fi

          rm -f "$TEMP_ALL"

          # 打印实际提取到的结果方便排查
          echo "==== 当前提取到的最新内容 ===="
          cat "$OUTPUT_FILE"

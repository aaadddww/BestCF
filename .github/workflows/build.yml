name: Auto Fetch Beijing Telecom BestCF

on:
  workflow_dispatch: # 支持手动点击立即运行
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时自动运行一次

permissions:
  contents: write # 必须赋予推送分支的写入权限

jobs:
  filter-bj-telecom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Process IPs
        run: |
          mkdir -p ./bestcf/
          OUTPUT_FILE="./bestcf/ctcc-ip.txt"
          > "$OUTPUT_FILE"
          
          TEMP_ALL=$(mktemp)
          
          # 1. 从多个带有国内探针测速结果的源聚合拉取
          echo "Fetching from upstream sources..."
          curl -sSL --connect-timeout 10 --max-time 20 "https://addressesapi.090227.xyz/CloudFlareYes" >> "$TEMP_ALL" || true
          curl -sSL --connect-timeout 10 --max-time 20 "https://raw.githubusercontent.com/cmliu/WorkerVless2sub/main/addressesapi.txt" >> "$TEMP_ALL" || true

          # 2. 提取 IPv4：优先匹配明确标记“北京”或“BJ”的记录
          echo "Filtering Beijing Telecom IPv4..."
          BJ_V4_LIST=$(grep -E '北京|BJ' "$TEMP_ALL" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | sort -u | head -n 5)

          # 3. 补充匹配：若明确带地域的不足 5 个，从池中提取对北方/北京电信出口最优的 Anycast 网段
          # 162.159.* 和 172.64.(140-159).* 在北京电信出口通常能直连或路由较好
          if [ $(echo "$BJ_V4_LIST" | sed '/^$/d' | wc -l) -lt 5 ]; then
            RESERVE_V4=$(grep -Eo '162\.159\.[0-9]{1,3}\.[0-9]{1,3}|172\.64\.(14[0-9]|15[0-9])\.[0-9]{1,3}' "$TEMP_ALL" | sort -u | head -n 5)
            BJ_V4_LIST=$(echo -e "${BJ_V4_LIST}\n${RESERVE_V4}" | sed '/^$/d' | sort -u | head -n 5)
          fi

          # 4. 最终兜底：若仍不足 5 个，取电信通用池前 5 个 IPv4 补齐
          if [ $(echo "$BJ_V4_LIST" | sed '/^$/d' | wc -l) -lt 5 ]; then
            FALLBACK_V4=$(grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' "$TEMP_ALL" | sort -u | head -n 5)
            BJ_V4_LIST=$(echo -e "${BJ_V4_LIST}\n${FALLBACK_V4}" | sed '/^$/d' | sort -u | head -n 5)
          fi

          # 格式化写入 IPv4
          INDEX=1
          for ip in $BJ_V4_LIST; do
            if [ -n "$ip" ]; then
              echo "${ip}#BJ-CT_v4_${INDEX}" >> "$OUTPUT_FILE"
              INDEX=$((INDEX + 1))
            fi
          done

          # 5. 提取 IPv6（取前 3 个）
          echo "Filtering IPv6..."
          V6_LIST=$(grep -Eo '([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|[0-9a-fA-F]{1,4}:(:[0-9a-fA-F]{1,4}){1,6}' "$TEMP_ALL" | sort -u | head -n 3)
          INDEX=1
          for ip in $V6_LIST; do
            if [ -n "$ip" ]; then
              echo "[${ip}]#BJ-CT_v6_${INDEX}" >> "$OUTPUT_FILE"
              INDEX=$((INDEX + 1))
            fi
          done

          # 6. 断网应急保障：如果所有源全部超时为空，写入内置高可用基线
          if [ ! -s "$OUTPUT_FILE" ]; then
            cat << 'EOF' > "$OUTPUT_FILE"
          162.159.35.20#BJ-CT_v4_1
          172.64.147.110#BJ-CT_v4_2
          172.64.155.159#BJ-CT_v4_3
          172.64.150.64#BJ-CT_v4_4
          172.64.144.224#BJ-CT_v4_5
          [2606:4700:53::ed49:aad6]#BJ-CT_v6_1
          [2a06:98c1:3105::c695:78d0]#BJ-CT_v6_2
          [2606:4700:52::e33a:8a05]#BJ-CT_v6_3
          EOF
          fi

          rm -f "$TEMP_ALL"
          echo "Generated Results:"
          cat "$OUTPUT_FILE"

      - name: Deploy to Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: bestcf
          folder: ./bestcf/
          single-commit: true

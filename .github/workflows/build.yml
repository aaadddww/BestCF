name: Beijing Telecom CF IP
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get BJ Telecom IP
        run: |
          mkdir -p ./bestcf/
          echo "162.159.35.20#BJ-CT_v4_1" > ./bestcf/ctcc-ip.txt
          echo "172.64.147.110#BJ-CT_v4_2" >> ./bestcf/ctcc-ip.txt
          echo "172.64.155.159#BJ-CT_v4_3" >> ./bestcf/ctcc-ip.txt
          echo "172.64.150.64#BJ-CT_v4_4" >> ./bestcf/ctcc-ip.txt
          echo "172.64.144.224#BJ-CT_v4_5" >> ./bestcf/ctcc-ip.txt
          echo "[2606:4700:53::ed49:aad6]#BJ-CT_v6_1" >> ./bestcf/ctcc-ip.txt
          echo "[2a06:98c1:3105::c695:78d0]#BJ-CT_v6_2" >> ./bestcf/ctcc-ip.txt
          echo "[2606:4700:52::e33a:8a05]#BJ-CT_v6_3" >> ./bestcf/ctcc-ip.txt

      - name: Push to branch
        run: |
          cd ./bestcf/
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git checkout -b bestcf
          git add . && git commit -m "Beijing Telecom IP Updated"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}"
          git push -f origin bestcf

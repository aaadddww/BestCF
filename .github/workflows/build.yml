name: Beijing Telecom CF IP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Format Telecom IPs
        run: |
          mkdir -p ./bestcf/
          OUTPUT_FILE="./bestcf/ctcc-ip.txt"
          > "$OUTPUT_FILE"

          # 1. 获取动态电信优选 IP 列表（若拉取失败则降级重试）
          RAW_DATA=$(curl -sSL --connect-timeout 10 "https://addressesapi.090227.xyz/CloudFlareYes" || true)

          # 2. 提取 IPv4（取前 5 个）并编号
          IPV4_LIST=$(echo "$RAW_DATA" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n 5)
          INDEX=1
          for ip in $IPV4_LIST; do
            echo "${ip}#BJ-CT_v4_${INDEX}" >> "$OUTPUT_FILE"
            INDEX=$((INDEX + 1))
          done

          # 3. 提取 IPv6（取前 3 个）并格式化包裹括号
          IPV6_LIST=$(echo "$RAW_DATA" | grep -Eo '([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:' | head -n 3)
          INDEX=1
          for ip in $IPV6_LIST; do
            echo "[${ip}]#BJ-CT_v6_${INDEX}" >> "$OUTPUT_FILE"
            INDEX=$((INDEX + 1))
          done

      - name: Deploy to Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: bestcf
          folder: ./bestcf/
          single-commit: true
